<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateDesk - 运维端后台</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 24px;
      }
      .container { max-width: 900px; margin: 0 auto; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .header h1 { margin: 0; }
      .nav a { text-decoration: none; background: #111827; color: white; padding: 10px 14px; border-radius: 8px; }
      .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 8px 18px rgba(17,24,39,0.06); }
      .list { display: grid; gap: 14px; margin-top: 14px; }
      .item {
        border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      }
      .item .left { display: grid; gap: 4px; }
      .id-num { font-family: monospace; font-weight: bold; color: #1d4ed8; font-size: 16px; }
      .status-pill {
        display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: bold;
        background: #e0f2fe; color: #075985;
      }
      .status-pill.requested { background: #fef3c7; color: #92400e; }
      .status-pill.assisting { background: #dcfce7; color: #166534; }
      .status-pill.offline { background: #e5e7eb; color: #6b7280; }
      .status-pill.gd-offline { background: #fef9c3; color: #a16207; }
      .meta { color: #4b5563; font-size: 14px; }
      .banner { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
      .banner.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
      .banner.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
      button { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; color: white; font-weight: bold; }
      button:disabled { background: #9ca3af; cursor: not-allowed; }
      .enter-btn { background: #2563eb; }
      .control-btn { background: #7c3aed; }
      .localoff-btn { background: #0891b2; }
      .voice-btn { background: #0d9488; }
      .end-btn { background: #dc2626; }
      .back-btn { background: #6b7280; }
      .muted { color: #6b7280; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .rolebar { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 14px; }
      .rolebar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
      .chat { margin-top: 16px; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
      .chat-head { background: #111827; color: #fff; padding: 10px 14px; font-weight: bold; }
      .chat-msgs {
        height: 240px; overflow-y: auto; padding: 12px; background: #f9fafb;
        display: flex; flex-direction: column; gap: 8px;
      }
      .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
      .msg .meta { font-size: 11px; color: #9ca3af; margin-bottom: 2px; }
      .msg.user { align-self: flex-start; background: #e5e7eb; }
      .msg.me { align-self: flex-end; background: #a7f3d0; }
      .chat-input-row { display: flex; gap: 8px; padding: 10px; background: #fff; }
      .chat-input-row input { flex: 1; font-size: 14px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
      .chat-input-row button { padding: 10px 16px; font-size: 14px; background: #2563eb; }
      /* 本机会话与批准（GateDesk-api.md §6.7）：作用于运行本服务的这台机器 */
      .approval-item {
        border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 10px;
        background: #fff; display: grid; gap: 8px;
      }
      .approval-item:last-child { margin-bottom: 0; }
      .approval-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .badge {
        border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: bold;
        background: #e5e7eb; color: #374151;
      }
      .badge.wait { background: #fef3c7; color: #92400e; }
      .badge.ctrl { background: #fee2e2; color: #991b1b; }
      .badge.live { background: #dcfce7; color: #166534; }
      .control-ask {
        background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
        padding: 8px 10px; color: #991b1b; font-size: 14px;
      }
      .control-ask .countdown { font-family: monospace; font-weight: bold; }
      .perm { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: #374151; }
      .btn-small { padding: 8px 14px; font-size: 14px; }
      .btn-allow { background: #16a34a; }
      .btn-deny { background: #6b7280; }
      #approvalState { color: #4b5563; }
      #approvalNote { font-size: 13px; min-height: 18px; color: #166534; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>GateDesk远程协助（运维端）</h1>
        <div class="nav"><a href="/audit">审计看板</a></div>
      </div>

      <div id="selfId" class="banner info">
        本机（运维端）GateDesk ID：<span class="id-num" id="selfIdText">-</span>
        <span class="muted" id="selfStatusText"></span>
      </div>

      <div class="card" id="approvalCard">
        <h2 style="margin:0">本机会话与批准</h2>
        <div class="meta" style="margin-top:6px">
          §6.7 的批准动作作用于<b>运行本服务的这台机器</b>（代理固定指向它的 127.0.0.1:21120）。
          本机 API 只绑回环，所以运维机批准不到客户机的会话 —— 客户机的批准在它自己的 /employee 页上做。
        </div>
        <div class="meta" id="approvalState" style="margin-top:6px">正在读取会话…</div>
        <div class="list" id="approvalList"></div>
        <div id="approvalNote"></div>
      </div>

      <div class="card" id="roleCard">
        <div class="rolebar">
          <span class="muted">身份：</span>
          <label><input type="radio" name="role" value="operator" checked /> 运维</label>
        </div>
      </div>

      <!-- 设备列表 -->
      <div class="card" id="listCard">
        <h2 style="margin:0">客户设备</h2>
        <div class="list" id="deviceList">
          <div class="item"><span class="muted">加载中…</span></div>
        </div>
      </div>

      <!-- 进行中的协助 -->
      <div class="card" id="activeCard" hidden>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div>
            <h2 style="margin:0">协助 - <span class="id-num" id="deviceIdText">-</span></h2>
            <div class="meta" style="margin-top:6px">
              状态：<span class="status-pill" id="statePill">-</span>
            </div>
          </div>
          <button class="back-btn" id="backBtn">返回列表</button>
        </div>
        <div class="actions" style="margin-top:14px">
          <button class="control-btn" id="controlBtn">开始协助</button>
          <button class="localoff-btn" id="localOffBtn" disabled>断开本地会话</button>
          <button class="voice-btn" id="voiceBtn">打开语音</button>
          <button class="end-btn" id="endBtn">结束协助</button>
        </div>
        <p class="muted" id="ctrlHint" style="margin:10px 0 0;font-size:13px"></p>

        <!-- A 类四项：会静默外泄数据的通道，客户机上默认关。这里点一下是向客户机的
             GateDesk 发一个「请求开启」，走本机本地 API 的 /request-permission，最终由
             客户在他自己那台机器的 GateDesk 上点「允许」。所以这里没有勾选框：这不是
             本机的一个状态，读不到，画一个勾就是在骗人。 -->
        <div class="actions" id="permRow" style="margin-top:12px">
          <span class="muted" style="font-size:13px">请求客户机开启：</span>
          <button class="btn-small btn-allow" data-perm-req="keyboard" disabled>键鼠</button>
          <button class="btn-small btn-allow" data-perm-req="clipboard" disabled>剪贴板</button>
          <button class="btn-small btn-allow" data-perm-req="audio" disabled>声音</button>
          <button class="btn-small btn-allow" data-perm-req="file" disabled>文件传输</button>
        </div>

        <div class="chat" id="chatPanel" hidden>
          <div class="chat-head">与客户聊天<span id="chanStatus" class="muted" style="font-weight:400;font-size:12px;margin-left:8px"></span></div>
          <div class="chat-msgs" id="chatMsgs"></div>
          <div class="chat-input-row">
            <input id="chatInput" placeholder="输入消息，按回车发送" disabled />
            <button id="chatSend" disabled>发送</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const ENDPOINT = location.origin;
      // 本机 GateDesk 本地 API token 取自 URL（start.sh 打开时带入）；读到后存入
      // sessionStorage，刷新保持（同标签页内）。
      const urlToken = new URLSearchParams(location.search).get('token') || '';
      const TOKEN = (urlToken || sessionStorage.getItem('gd_token') || '');
      if (urlToken) {
        sessionStorage.setItem('gd_token', urlToken);
        // history.replaceState({}, '', location.pathname);
      }

      let role = 'operator';
      let activeDevice = null;
      let ws = null;
      let nativeActive = false; // 本机已通过 /connect 发起原生会话且尚未结束
      let selfId = null; // 运维机自己的 GateDesk ID，设备列表里排除，避免自己和自己聊天

      const $ = (id) => document.getElementById(id);

      async function localJson(path, options) {
        // 本机 GateDesk 操作走服务端 /api/local 代理（同源），token 随请求带上由服务端校验。
        const sep = path.includes('?') ? '&' : '?';
        const res = await fetch(ENDPOINT + '/api/local' + path + sep + 'token=' + encodeURIComponent(TOKEN), {
          method: (options && options.method) || 'GET',
          headers: { 'Content-Type': 'application/json' },
          body: (options && options.body) || undefined,
        });
        let body = null;
        try { body = await res.json(); } catch { }
        if (!res.ok) {
          const err = new Error((body && body.error) || ('HTTP ' + res.status));
          err.status = res.status; // 调用方需要区分 409/503/504（GateDesk-api.md §7）
          throw err;
        }
        return body;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
      }

      const stateMap = {
        online: '在线',
        requested: '已请求协助',
        assisting: '协助中',
        offline: '离线',
        'gd-offline': 'GateDesk离线',
      };

      // 显示状态三档：页面没了→离线；页面在但 GateDesk 未登入→GateDesk离线；否则按交互状态。
      function devStatus(d) {
        if (!d.online) return 'offline';
        if (!d.gdOnline) return 'gd-offline';
        if (d.inSession || d.state === 'assisting') return 'assisting';
        return d.state === 'requested' ? 'requested' : 'online';
      }

      function pill(state) {
        return `<span class="status-pill ${state}">${stateMap[state] || state}</span>`;
      }

      async function login() {
        const res = await fetch(ENDPOINT + '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '登录失败');
      }

      async function loadDevices() {
        try {
          const res = await fetch(ENDPOINT + '/api/devices');
          const data = await res.json();
          renderList(data.devices || []);
        } catch (e) {
          $('deviceList').innerHTML = '<div class="item"><span class="muted">服务端不可达：' + escapeHtml(e.message) + '</span></div>';
        }
      }

      function renderList(devices) {
        // 自身设备（本机 GateDesk ID）只有在「本机同时作为客户端在跑 employee」时才列出来，
        // 否则不显示、也就无法自己和自己聊天。真实客户设备恒显示。
        const others = devices.filter((d) => d.id !== selfId || d.clientOnline === true);
        if (!others.length) {
          $('deviceList').innerHTML = '<div class="item"><span class="muted">当前无在线客户设备。请客户先打开本机 GateDesk 并运行 start-client.sh。</span></div>';
          return;
        }
        $('deviceList').innerHTML = others.map((d) => {
          let action = '';
          if (d.state === 'requested') {
            action = `<button class="control-btn" data-act="start" data-id="${escapeHtml(d.id)}">开始协助</button>`;
          } else if (d.state === 'assisting') {
            action = `<button class="end-btn" data-act="end" data-id="${escapeHtml(d.id)}">结束协助</button>`;
          }
          return `
          <div class="item">
            <div class="left">
              <div><span class="id-num">${escapeHtml(d.id)}</span> ${pill(devStatus(d))}</div>
              <div class="meta">最近在线：${new Date(d.lastSeen).toLocaleString()}</div>
            </div>
            <div class="actions">
              ${action}
              <button class="enter-btn" data-act="enter" data-id="${escapeHtml(d.id)}">聊天</button>
            </div>
          </div>`;
        }).join('');
        $('deviceList').querySelectorAll('button[data-act]').forEach((b) => {
          b.addEventListener('click', () => {
            const id = b.dataset.id;
            const act = b.dataset.act;
            if (act === 'start') startControl(id);
            else if (act === 'end') endSession(id);
            else enterDevice(id);
          });
        });
      }

      function appendMessage(m) {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.role === 'user' ? 'user' : 'me');
        const time = new Date(m.at).toLocaleTimeString();
        div.innerHTML =
          `<div class="meta">${escapeHtml(m.from)} · ${time}</div>` +
          `<div>${escapeHtml(m.text)}</div>`;
        $('chatMsgs').appendChild(div);
        $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
      }

      function setState(state) {
        const s = $('statePill');
        s.className = 'status-pill ' + state;
        s.textContent = stateMap[state] || state;
        if (state === 'assisting') {
          $('ctrlHint').textContent = '请在打开的 GateDesk 原生窗口中完成远程协助；结束请点击「断开本地会话」或「结束协助」。';
        } else if (state === 'requested') {
          $('ctrlHint').textContent = '客户已请求协助，点击「开始协助」进入远程桌面。';
        } else {
          $('ctrlHint').textContent = '';
        }
        $('controlBtn').disabled = state !== 'requested';
        $('localOffBtn').disabled = state !== 'assisting';
        // Asking a peer to do anything only makes sense while we are actually in a session
        // with it; outside one there is no connection to ask on.
        document.querySelectorAll('#permRow button[data-perm-req]').forEach((el) => {
          el.disabled = state !== 'assisting';
        });
      }

      // 实时通道：聊天靠它，会话状态靠它。所以它断了不能只是静默地把 ws
      // 置空——那就变成「点一下说尚未连接」，看不出为什么。这里记下断开原因、写在页面上，
      // 并按秒重连：服务端的设备记录是内存态，一次重启就会把在途的连接全掐了。
      let chatClosed = '';
      let chatRetry = null;

      function connectChat() {
        if (chatRetry) { clearTimeout(chatRetry); chatRetry = null; }
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const sock = new WebSocket(`${proto}${location.host}/ws?deviceId=${activeDevice.id}&role=${role}`);
        ws = sock;
        sock.onopen = () => {
          if (ws !== sock) return;
          chatClosed = '';
          $('chanStatus').textContent = '';
          $('chatPanel').hidden = false;
          $('chatInput').disabled = false;
          $('chatSend').disabled = false;
        };
        sock.onmessage = (event) => {
          // 换设备时旧 socket 的消息还会晚一步到，不能让它写进新设备的界面。
          if (ws !== sock) return;
          const data = JSON.parse(event.data);
          if (data.type === 'history') {
            $('chatMsgs').innerHTML = '';
            (data.messages || []).forEach(appendMessage);
          } else if (data.type === 'chat') {
            appendMessage(data.message);
          } else if (data.type === 'session-state') {
            setState(data.state);
          } else if (data.type === 'control-started') {
            setState('assisting');
          } else if (data.type === 'control-ended' || data.type === 'peer-ended') {
            // 会话结束（无论谁发起）：先断开本机由 /connect 发起的原生会话，再更新状态。
            tearDownLocal();
            nativeActive = false;
            if (data.type === 'peer-ended' && data.by === 'user') alert('客户已结束协助。');
            setState('online');
          } else if (data.type === 'event') {
            // §6.10 的事件只是提醒，不是状态：到达时那个申请可能已经被现场的人点了，
            // 或已经超时。所以拿它当「现在去查一次」的信号，而不是直接改界面。
            onServerEvent();
          }
        };
        sock.onclose = (event) => {
          // 只有「当前这条」断了才算断：换设备时会先 close 旧的，它的 onclose 是晚一步到的，
          // 少了这道判断就会把新连接一并置空，再顺手多连一条。
          if (ws !== sock) return;
          ws = null;
          chatClosed = event.code
            ? `已断开（${event.code}${event.reason ? ' ' + event.reason : ''}）`
            : '已断开';
          // 还在这个设备的协助页里就自己接回来，否则一次服务端重启会让整页失效到刷新为止。
          if (activeDevice) {
            $('chanStatus').textContent = '实时通道' + chatClosed + '，重连中…';
            chatRetry = setTimeout(() => { if (activeDevice) connectChat(); }, 2000);
          }
        };
      }

      // 点下游开关时通道可能正在重连，或刚断。等它连上再发——「还没连上」不是「你点错了」，
      // 不该拿一句「尚未连接」把原因藏起来。

      function sendChat() {
        const text = $('chatInput').value.trim();
        if (!text || !ws || ws.readyState !== 1) return;
        appendMessage({ from: '运维', role: 'operator', text, at: Date.now() });
        ws.send(JSON.stringify({ type: 'chat', from: '运维', text }));
        $('chatInput').value = '';
      }

      function enterDevice(deviceId) {
        if (!deviceId) return;
        if (ws) { ws.close(); ws = null; }
        activeDevice = { id: deviceId };
        $('listCard').hidden = true;
        $('activeCard').hidden = false;
        $('deviceIdText').textContent = deviceId;
        $('chatMsgs').innerHTML = '';
        $('chatPanel').hidden = true;
        $('ctrlHint').textContent = '接入中…';
        connectChat();
      }

      function backToList() {
        if (ws) { ws.close(); ws = null; }
        activeDevice = null;
        $('activeCard').hidden = true;
        $('listCard').hidden = false;
        loadDevices();
      }

      // 发起远程控制：请求服务端下发受控端凭据，再触发本机 GateDesk 原生连接。
      async function startControl(deviceId) {
        if (!deviceId) return;
        enterDevice(deviceId);
        try {
          const res = await fetch(ENDPOINT + '/api/request/start', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId }),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '控制请求失败');
          const q = '/connect?id=' + encodeURIComponent(data.id) +
                    '&password=' + encodeURIComponent(data.password || '');
          await localJson(q, { method: 'POST' });
          nativeActive = true;
          setState('assisting');
        } catch (e) {
          alert('发起远程控制失败：' + e.message);
        }
      }

      async function disconnectLocal() {
        if (!activeDevice) return;
        nativeActive = false;
        try {
          await localJson('/disconnect', { method: 'POST' }).catch(() => {});
          await notifyServerEnd(activeDevice.id);
          setState('online');
          loadDevices();
          alert('已断开本机发起的远程会话，并已通知客户。');
        } catch (e) {
          alert('断开失败：' + e.message);
        }
      }

      // 会话结束时的兜底：静默断开本机原生会话，避免对端结束后本地残留。
      function tearDownLocal() {
        localJson('/disconnect', { method: 'POST' }).catch(() => {});
      }

      // 通知服务端结束该设备协助（对端会收到 peer-ended）。吞掉网络错误。
      async function notifyServerEnd(deviceId) {
        if (!deviceId) return;
        try {
          await fetch(ENDPOINT + '/api/request/end', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId, by: 'operator' }),
          });
        } catch (e) { /* 服务端不可达时保留本地状态，稍后可手动结束 */ }
      }

      // 周期性探测本机原生会话：若 /connect 发起的原生进程已退出（如控制窗口被直接关闭、
      // 连接意外断开）而服务端仍认为 assisting，则代服务端收尾——通知结束并刷新状态。
      async function watchNativeSession() {
        if (!nativeActive || !activeDevice) return;
        let st;
        try { st = await localJson('/status'); } catch { return; }
        if (st.in_session) return;
        nativeActive = false;
        await notifyServerEnd(activeDevice.id);
        setState('online');
        loadDevices();
      }

      // 向对端要四项 A 类权限之一（GateDesk-api.md §6.9 POST /request-permission，
      // v1.15 起 `keyboard` 也是其中一个名字）。只走本机本地 API：
      // 本机 GateDesk 的会话进程把请求当 OptionMessage 发给对端，对端会弹自己的确认
      // 界面，客户不点就什么也不会变。所以这里没有勾选框——
      // 这是「问」，不是本机的一个状态；勾在谁名下、客户答了什么，只有客户那台机器知道。
      const PERM_LABELS = { keyboard: '键鼠', clipboard: '剪贴板', audio: '声音', file: '文件传输' };

      async function requestPermission(name) {
        const id = activeDevice && activeDevice.id;
        if (!id) return;
        const label = PERM_LABELS[name] || name;
        try {
          await localJson('/request-permission', {
            method: 'POST',
            body: JSON.stringify({ id, name }),
          });
          $('ctrlHint').textContent =
            '已向 ' + id + ' 请求开启「' + label + '」。请在客户机的 GateDesk 上点「允许」，' +
            '60 秒内无应答按拒绝处理。';
        } catch (e) {
          alert('请求开启「' + label + '」失败：' + e.message);
        }
      }

      // 「打开语音」在运维页就是请客户机把 audio 权限给出来：语音是受控端会话内的开关，
      // 本机（控制端）读不到也改不了对端的状态，所以走与「请求客户机开启：声音」同一条路，
      // 不再假装它是本机的一个开关（本机没有会话时 /voice 会直接 409）。
      async function toggleVoice() {
        await requestPermission('audio');
      }

      async function endSession(deviceId) {
        const id = deviceId || (activeDevice && activeDevice.id);
        if (!id) return;
        nativeActive = false;
        try {
          await localJson('/disconnect', { method: 'POST' }).catch(() => {});
          const res = await fetch(ENDPOINT + '/api/request/end', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId: id, by: 'operator' }),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '结束失败');
          setState('online');
          loadDevices();
        } catch (e) {
          alert('结束协助失败：' + e.message);
        }
      }

      $('backBtn').addEventListener('click', backToList);
      $('controlBtn').addEventListener('click', () => startControl(activeDevice.id));
      $('localOffBtn').addEventListener('click', disconnectLocal);
      $('voiceBtn').addEventListener('click', toggleVoice);
      $('endBtn').addEventListener('click', () => endSession());
      $('chatSend').addEventListener('click', sendChat);
      $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
      $('approvalList').addEventListener('click', onApprovalClick);
      $('approvalList').addEventListener('change', onApprovalChange);
      document.querySelectorAll('#permRow button[data-perm-req]').forEach((el) => {
        el.addEventListener('click', () => requestPermission(el.dataset.permReq));
      });
      document.querySelectorAll('input[name=role]').forEach((r) => {
        r.addEventListener('change', async () => {
          role = r.value;
          try { await login(); } catch (e) { /* 服务端未启动时列表会显示不可达 */ }
          loadDevices();
        });
      });

      async function loadSelfId() {
        const badge = $('selfStatusText');
        try {
          const id = await localJson('/id');
          $('selfIdText').textContent = id.id || '-';
          selfId = id.id || null;
          if (!activeDevice) loadDevices(); // 已知本机 ID 后重列，去掉自己的设备
        } catch (e) {
          $('selfIdText').textContent = '-';
          badge.textContent = '（无法读取本机 GateDesk）';
          return;
        }
        const st = await localJson('/status').catch(() => null);
        if (st) {
          badge.textContent = st.online ? ' · 在线' : ' · 离线';
          if (st.assistable) badge.textContent += ' · 可被协助';
          if (st.in_session && st.peer_id) badge.textContent += ' · 正在协助 ' + st.peer_id;
        }
      }

      // ── 本机会话与批准：§6.7.2 /approve、§6.7.3 /control（GateDesk-api.md）────
      // 发现变化有两条路（§6.10）：桌面端配了 event-server-url 时会推事件，平台把它经
      // WebSocket 转给本页，页面收到就立刻查一次 /sessions；轮询只是兜底。
      // 页面无从知道对面配没配，所以先按快节奏轮询，**一旦真的收到过一条事件**就说明链路
      // 是通的，兜底随即放慢 —— 否则在没配的机器上会退化成「几十秒才发现有人敲门」。
      const CONTROL_WINDOW_MS = 60000; // 与控制层 CONTROL_REQUEST_TIMEOUT 对齐
      const SESSIONS_POLL_FAST_MS = 2000;   // 必须显著小于 60 秒，否则会错过控制窗口
      const SESSIONS_POLL_SLOW_MS = 30000;  // 事件链路已验证，兜底只为补齐丢掉的推送
      // §6.7.4 白名单里给客户看的四项。restart / recording 偏运维，block_input 仅
      // Windows，privacy_mode 要看平台实现，这三类留给桌面端面板。
      const PERMISSIONS = [
        { name: 'keyboard', label: '键鼠' },
        { name: 'clipboard', label: '剪贴板' },
        { name: 'audio', label: '声音' },
        { name: 'file', label: '文件传输' },
      ];
      const pendingSince = new Map(); // 会话 id -> 首次看到 pending_control 的时刻
      let sessionsSig = '';
      let noteTimer = null;
      let sessionsTimer = null;
      let sessionsPollMs = SESSIONS_POLL_FAST_MS;

      // 定时拉 /sessions。
      function startSessionsPolling() {
        if (!TOKEN) return;
        if (sessionsTimer) clearInterval(sessionsTimer);
        pollSessions();
        sessionsTimer = setInterval(pollSessions, sessionsPollMs);
      }

      // 收到一条 §6.10 事件（“去看一眼”，不是状态本身）：立刻查一次，
      // 并把兜底轮询放慢 —— 链路已经证明是通的。
      function onServerEvent() {
        if (sessionsPollMs !== SESSIONS_POLL_SLOW_MS) {
          sessionsPollMs = SESSIONS_POLL_SLOW_MS;
          if (sessionsTimer) {
            clearInterval(sessionsTimer);
            sessionsTimer = setInterval(pollSessions, sessionsPollMs);
          }
        }
        pollSessions();
      }

      function sessionPeer(s) {
        return (s.name || '').trim() || s.peer_id || '未知对端';
      }

      // 只有远程桌面类会话有这套权限开关；文件传输 / 摄像头 / 终端没有键鼠可给。
      function isDesktopSession(s) {
        return !s.is_file_transfer && !s.is_view_camera && !s.is_terminal && !s.port_forward;
      }

      function sessionBadge(s) {
        if (s.disconnected) return '<span class="badge">已结束</span>';
        if (!s.authorized) return '<span class="badge wait">等待接入</span>';
        if (s.pending_control) return '<span class="badge ctrl">请求控制</span>';
        return '<span class="badge live">协助中</span>';
      }

      function actionBtn(act, id, label, cls, accept) {
        const extra = accept === undefined ? '' : ` data-accept="${accept}"`;
        return `<button class="btn-small ${cls}" data-act="${act}" data-id="${id}"${extra}>${label}</button>`;
      }

      function sessionHtml(s) {
        const out = ['<div class="approval-item">'];
        out.push(
          `<div class="approval-head"><b>${escapeHtml(sessionPeer(s))}</b>` +
            `<span class="meta">ID ${escapeHtml(s.peer_id || '—')}</span>${sessionBadge(s)}</div>`
        );
        if (!s.authorized && !s.disconnected) {
          out.push('<div class="meta">该对端正在请求接入本机。</div>');
          out.push(
            '<div class="actions">' +
              actionBtn('approve', s.id, '允许接入', 'btn-allow', true) +
              actionBtn('approve', s.id, '拒绝', 'btn-deny', false) +
              '</div>'
          );
        }
        if (s.pending_control) {
          const since = pendingSince.get(s.id) || Date.now();
          out.push(
            '<div class="control-ask">对端请求接管本机键盘鼠标，还有 ' +
              `<span class="countdown" data-deadline="${since + CONTROL_WINDOW_MS}">…</span>，` +
              '超时按拒绝处理。</div>'
          );
          out.push(
            '<div class="actions">' +
              actionBtn('control', s.id, '允许控制', 'btn-allow', true) +
              actionBtn('control', s.id, '拒绝控制', 'btn-deny', false) +
              '</div>'
          );
        }
        if (s.authorized && !s.disconnected && isDesktopSession(s)) {
          out.push(
            '<div class="meta">权限（与「允许控制」是两道独立的闸门，都给了对端才能真正操作键鼠）：</div>'
          );
          out.push(
            '<div class="actions">' +
              PERMISSIONS.map(
                (p) =>
                  `<label class="perm"><input type="checkbox" data-act="permission" ` +
                  `data-id="${s.id}" data-name="${p.name}"${s[p.name] ? ' checked' : ''}> ${p.label}</label>`
              ).join('') +
              '</div>'
          );
        }
        out.push('<div class="actions">');
        out.push(
          s.disconnected
            ? actionBtn('dismiss', s.id, '清理', 'btn-deny')
            : actionBtn('terminate', s.id, '结束该会话', 'end-btn')
        );
        out.push('</div></div>');
        return out.join('');
      }

      function sessionsSignature(list) {
        return list
          .map((s) =>
            [
              s.id, s.authorized, s.disconnected, s.pending_control,
              s.keyboard, s.clipboard, s.audio, s.file,
              s.name, s.peer_id,
            ].join(',')
          )
          .join('|');
      }

      function renderApprovals(list) {
        // 卡片常驻显示（批准入口藏起来就找不到了），所以只重建列表内容。
        const sig = sessionsSignature(list);
        if (sig === sessionsSig) return; // 内容没变就别重建 DOM，否则会闪、也会把倒计时重新起算
        sessionsSig = sig;
        $('approvalList').innerHTML = list.map(sessionHtml).join('');
        tickCountdowns();
      }

      function tickCountdowns() {
        const now = Date.now();
        document.querySelectorAll('#approvalList [data-deadline]').forEach((el) => {
          const left = Math.max(0, (Number(el.dataset.deadline) || 0) - now);
          el.textContent = Math.ceil(left / 1000) + ' 秒';
        });
      }
      setInterval(tickCountdowns, 500);

      // 卡片常驻显示，所以“现在能不能批准、为什么不能”必须写出来。
      function setApprovalState(text, kind) {
        const el = $('approvalState');
        el.textContent = text;
        el.style.color = kind === 'bad' ? '#dc2626' : kind === 'warn' ? '#92400e' : '#4b5563';
      }

      async function pollSessions() {
        if (!TOKEN) {
          setApprovalState('未携带本地 API token，批准功能不可用。请用 start.sh 打开本页。', 'warn');
          renderApprovals([]);
          return;
        }
        let data;
        try {
          data = await localJson('/sessions');
        } catch (e) {
          pendingSince.clear();
          if (e.status === 503) {
            // 503 不是故障：本机没有连接管理器在听（没有会话，或会话面板窗口已退出）。
            setApprovalState('本机没有会话面板在运行：当前没有对端接入本机，或会话面板已退出。');
          } else if (e.status === 401) {
            setApprovalState('本地 API 返回 401：token 与服务端 API_TOKEN 不一致。', 'bad');
          } else if (e.status === 502) {
            setApprovalState('本机 GateDesk 不可达：' + e.message, 'bad');
          } else {
            setApprovalState('无法读取会话列表：' + e.message, 'bad');
          }
          renderApprovals([]);
          return;
        }
        const list = (data && data.sessions) || [];
        // 服务端的 60 秒从请求抵达时开始算，页面只能从「第一次看到」起算，
        // 所以这个倒计时最多乐观一个轮询周期；真正的裁决在服务端。
        const seen = new Set();
        for (const s of list) {
          seen.add(s.id);
          if (!s.pending_control) pendingSince.delete(s.id);
          else if (!pendingSince.has(s.id)) pendingSince.set(s.id, Date.now());
        }
        for (const id of [...pendingSince.keys()]) {
          if (!seen.has(id)) pendingSince.delete(id);
        }
        setApprovalState(
          list.length === 0 ? '当前没有对端请求接入或控制。' : '以下对端需要处理：'
        );
        renderApprovals(list);
      }

      function note(text, bad) {
        const el = $('approvalNote');
        el.textContent = text || '';
        el.style.color = bad ? '#dc2626' : '#166534';
        if (noteTimer) clearTimeout(noteTimer);
        if (text) noteTimer = setTimeout(() => { el.textContent = ''; }, 4000);
      }

      // §6.7 的动作都是幂等的：409 说明状态已经变了（放行已放行的、应答已被超时拒绝的
      // 控制请求），504 说明连接管理器没在 2 秒内回话。这两种情况重新拉一次 /sessions 就够。
      async function sessionAction(path, body, okText) {
        try {
          await localJson(path, { method: 'POST', body: JSON.stringify(body) });
          note(okText);
        } catch (e) {
          if (e.status === 409 || e.status === 404 || e.status === 504) {
            note('状态已变化，已刷新', true);
          } else if (e.status === 503) {
            note('本机没有会话面板在运行，无法代为批准', true);
          } else {
            note('操作失败：' + e.message, true);
          }
        }
        await pollSessions();
      }

      function onApprovalClick(event) {
        const el = event.target.closest('button[data-act]');
        if (!el) return;
        const id = Number(el.dataset.id);
        const accept = el.dataset.accept === 'true';
        switch (el.dataset.act) {
          case 'approve':
            sessionAction('/approve', { id, accept }, accept ? '已放行接入' : '已拒绝接入');
            break;
          case 'control':
            // 与桌面端面板一致：允许控制只应答控制请求，不动权限开关（两者是独立闸门）。
            sessionAction('/control', { id, accept }, accept ? '已允许控制' : '已拒绝控制');
            break;
          case 'terminate':
            if (confirm('结束该会话？对端会收到通知，之后可以重新连接。')) {
              sessionAction('/terminate', { id }, '已结束该会话');
            }
            break;
          case 'dismiss':
            sessionAction('/dismiss', { id }, '已清理');
            break;
        }
      }

      function onApprovalChange(event) {
        const el = event.target;
        if (!el || el.dataset.act !== 'permission') return;
        const found = PERMISSIONS.find((p) => p.name === el.dataset.name);
        const label = (found && found.label) || el.dataset.name;
        sessionAction(
          '/permission',
          { id: Number(el.dataset.id), name: el.dataset.name, enabled: el.checked },
          label + (el.checked ? '已打开' : '已关闭')
        );
      }

      async function init() {
        loadSelfId();
        try { await login(); } catch (e) { /* 服务端可能尚未启动 */ }
        loadDevices();
        setInterval(() => { if (!activeDevice) loadDevices(); }, 3000);
        setInterval(watchNativeSession, 2000);
        // 本机会话：事件是快路径（§6.10），轮询是兜底（§8.1 要求间隔远小于 60 秒）。
        startSessionsPolling();
      }
      init();
    </script>
  </body>
</html>
