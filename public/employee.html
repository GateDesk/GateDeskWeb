<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateDesk - 客户远程协助</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      h1 { margin-top: 0; color: #1f2937; }
      .banner {
        padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px;
      }
      .banner.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
      .banner.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
      .card {
        background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px;
        margin-bottom: 16px; display: grid; gap: 8px;
      }
      .card h3 { margin: 0; color: #374151; }
      .kv { font-size: 14px; color: #4b5563; }
      .id-num { font-family: monospace; font-weight: bold; color: #1d4ed8; font-size: 18px; }
      .status-pill {
        display: inline-block; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: bold;
        background: #e0f2fe; color: #075985;
      }
      .status-pill.requested { background: #fef3c7; color: #92400e; }
      .status-pill.assisting { background: #dcfce7; color: #166534; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      button {
        border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; color: white; font-weight: bold;
      }
      button:disabled { background: #9ca3af; cursor: not-allowed; }
      .btn-request { background: #2563eb; }
      .btn-voice { background: #0891b2; }
      .btn-end { background: #dc2626; }
      .btn-retry { background: #6b7280; }
      .chat {
        border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; margin-top: 4px;
      }
      .chat-head { background: #111827; color: #fff; padding: 10px 14px; font-weight: bold; }
      .chat-msgs {
        height: 220px; overflow-y: auto; padding: 12px; background: #f9fafb;
        display: flex; flex-direction: column; gap: 8px;
      }
      .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
      .msg .meta { font-size: 11px; color: #9ca3af; margin-bottom: 2px; }
      .msg.operator { align-self: flex-start; background: #e5e7eb; }
      .msg.me { align-self: flex-end; background: #bfdbfe; }
      .chat-input-row { display: flex; gap: 8px; padding: 10px; background: #fff; }
      .chat-input-row input { flex: 1; font-size: 14px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
      .chat-input-row button { padding: 10px 16px; font-size: 14px; background: #2563eb; }
      /* 被控端批准：接入与控制都要本机点头（GateDesk-api.md §6.7） */
      .approval-item {
        border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 10px;
        background: #fff; display: grid; gap: 8px;
      }
      .approval-item:last-child { margin-bottom: 0; }
      .approval-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .badge {
        border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: bold;
        background: #e5e7eb; color: #374151;
      }
      .badge.wait { background: #fef3c7; color: #92400e; }
      .badge.ctrl { background: #fee2e2; color: #991b1b; }
      .badge.live { background: #dcfce7; color: #166534; }
      .control-ask {
        background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
        padding: 8px 10px; color: #991b1b; font-size: 14px;
      }
      .control-ask .countdown { font-family: monospace; font-weight: bold; }
      .perm { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: #374151; }
      .btn-small { padding: 8px 14px; font-size: 14px; }
      .btn-allow { background: #16a34a; }
      .btn-deny { background: #6b7280; }
      #approvalNote { font-size: 13px; min-height: 18px; color: #166534; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>GateDesk 远程协助（客户端）</h1>

      <div id="tokenWarn" class="banner warn" hidden>
        未携带本地 API token（应通过 start-client.sh 打开本页）。本机 GateDesk ID 与协助功能不可用。
      </div>
      <div id="permHint" class="banner info" hidden>
        首次远程协助请在系统设置中给 GateDesk 授予 <b>屏幕录制</b> 与 <b>麦克风</b> 权限，否则运维人员无法看到您的画面。
      </div>

      <div id="setup" class="card">
        <h3>本机设备</h3>
        <div class="kv" id="deviceLine">正在读取本机 GateDesk ID…</div>
        <div class="kv" id="deviceErr" hidden style="color:#dc2626"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn-retry" id="retryBtn" hidden>重试</button>
        </div>
      </div>

      <div id="sessionCard" class="card" hidden>
        <h3>协助</h3>
        <div class="kv">
          状态：<span class="status-pill" id="statePill">在线</span>
        </div>
        <div class="kv" id="pairHint">尚未请求协助。需要帮助时点击「请求协助」。</div>
        <div class="row" style="margin-top:8px">
          <button class="btn-request" id="requestBtn">请求协助</button>
          <button class="btn-voice" id="voiceBtn">打开语音</button>
          <button class="btn-end" id="endBtn" disabled>结束协助</button>
        </div>
      </div>

      <div id="approvalCard" class="card">
        <h3>接入与控制批准</h3>
        <div class="kv">
          本机作为被控端：对端要进来、要操作您的键盘鼠标，都得您在这里点头。
          接入后默认只读，控制请求 60 秒内不处理按拒绝算。
        </div>
        <div class="kv" id="approvalState">正在读取会话…</div>
        <div id="approvalList"></div>
        <div id="approvalNote"></div>
      </div>

      <div class="chat" id="chatPanel" hidden>
        <div class="chat-head">与运维人员聊天</div>
        <div class="chat-msgs" id="chatMsgs"></div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="输入消息，按回车发送" disabled />
          <button id="chatSend" disabled>发送</button>
        </div>
      </div>
    </div>

    <script>
      const LOCAL = 'http://127.0.0.1:21120';
      const ENDPOINT = location.origin;
      // 本机 API token 取自 URL（start-client.ps1 打开时带入）；读到后存入
      // sessionStorage，刷新保持（同标签页内），并立即从地址栏抹掉不留痕。
      const urlToken = new URLSearchParams(location.search).get('token') || '';
      const TOKEN = (urlToken || sessionStorage.getItem('gd_token') || '');
      if (urlToken) {
        sessionStorage.setItem('gd_token', urlToken);
      }

      let deviceId = null;
      let currentPassword = '';
      let ws = null;
      let voiceOn = false;

      const $ = (id) => document.getElementById(id);

      async function localJson(path, options) {
        const sep = path.includes('?') ? '&' : '?';
        const res = await fetch(LOCAL + path + sep + 'token=' + encodeURIComponent(TOKEN), options);
        let body = null;
        try { body = await res.json(); } catch { }
        if (!res.ok) {
          const err = new Error((body && body.error) || ('HTTP ' + res.status));
          err.status = res.status; // 调用方需要区分 409/503/504（GateDesk-api.md §7）
          throw err;
        }
        return body;
      }

      function randPassword(len) {
        const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
        let out = '';
        for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
        return out;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
      }

      function appendMessage(m) {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.role === 'operator' ? 'operator' : 'me');
        const time = new Date(m.at).toLocaleTimeString();
        div.innerHTML =
          `<div class="meta">${escapeHtml(m.from)} · ${time}</div>` +
          `<div>${escapeHtml(m.text)}</div>`;
        $('chatMsgs').appendChild(div);
        $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
      }

      function renderState(state) {
        const map = {
          online: '在线',
          requested: '已请求协助',
          assisting: '协助中',
        };
        const pill = $('statePill');
        pill.textContent = map[state] || state;
        pill.className = 'status-pill ' + state;
        if (state === 'requested') {
          $('pairHint').textContent = '已请求协助，等待运维人员接入…';
        } else if (state === 'assisting') {
          $('pairHint').textContent = '运维人员正在远程协助，请保持 GateDesk 开启。';
          $('permHint').hidden = false;
        } else {
          $('pairHint').textContent = '尚未请求协助。需要帮助时点击「请求协助」。';
        }
        $('requestBtn').disabled = state !== 'online';
        $('endBtn').disabled = state === 'online';
      }

      function connectChat() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(`${proto}${location.host}/ws?deviceId=${deviceId}&role=user`);
        ws.onopen = () => {
          $('chatPanel').hidden = false;
          $('chatInput').disabled = false;
          $('chatSend').disabled = false;
        };
        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'history') {
            $('chatMsgs').innerHTML = '';
            (data.messages || []).forEach(appendMessage);
          } else if (data.type === 'chat') {
            appendMessage(data.message);
          } else if (data.type === 'session-state') {
            renderState(data.state);
          } else if (data.type === 'control-started') {
            renderState('assisting');
          } else if (data.type === 'control-ended' || data.type === 'peer-ended') {
            if (data.type === 'peer-ended') alert('对方已结束协助。');
            renderState('online');
          }
        };
        ws.onclose = () => { ws = null; };
      }

      function sendChat() {
        const text = $('chatInput').value.trim();
        if (!text || !ws || ws.readyState !== 1) return;
        appendMessage({ from: '客户', role: 'user', text, at: Date.now() });
        ws.send(JSON.stringify({ type: 'chat', from: '客户', text }));
        $('chatInput').value = '';
      }

      async function toggleVoice() {
        try {
          await localJson('/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: !voiceOn }),
          });
          voiceOn = !voiceOn;
          $('voiceBtn').textContent = voiceOn ? '关闭语音' : '打开语音';
        } catch (e) {
          alert('语音切换失败：' + e.message);
        }
      }

      // 读本机 ID 并自动上线（上报给运维端），无需手填。
      async function goOnline() {
        if (!TOKEN) throw new Error('缺少本地 API token');
        const data = await localJson('/id');
        deviceId = data.id;
        $('deviceLine').innerHTML =
          '本机 GateDesk ID：<span class="id-num">' + escapeHtml(deviceId) + '</span><span class="muted" id="selfStatus"></span>';
        // 1) 轮换一个随机连接密码
        currentPassword = randPassword(8);
        await localJson('/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: currentPassword }),
        });
        // 2) 上报本机 ID 与密码（服务端由此获得本机 ID）
        const res = await fetch(ENDPOINT + '/api/device/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: deviceId, password: currentPassword }),
        });
        const reg = await res.json();
        if (!reg.ok) throw new Error(reg.error || '上线失败');
        $('sessionCard').hidden = false;
        renderState(reg.device.state);
        refreshStatus();
        connectChat();
      }

      // 本机 GateDesk 状态（是否登入 rendezvous、可被协助、会话中）：读一次 → 刷徽章 + 连同页面存活一起上报。
      async function refreshStatus() {
        if (deviceId) {
          const st = await localJson('/status').catch(() => null);
          const el = $('selfStatus');
          if (el && st) {
            let s = st.online ? ' · 在线' : ' · 离线';
            if (st.assistable) s += ' · 可被协助';
            if (st.in_session) s += ' · 会话中';
            el.textContent = s;
          }
          sendHeartbeat(st);
          return;
        }
        sendHeartbeat(null);
      }

      // 向服务端上报：页面存活（本次调用本身）+ 本机 GateDesk 的 /status 快照。
      function sendHeartbeat(st) {
        if (!deviceId) return;
        fetch(ENDPOINT + '/api/device/heartbeat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: deviceId,
            online: !!(st && st.online),
            assistable: !!(st && st.assistable),
            inSession: !!(st && st.in_session),
          }),
        }).catch(() => {});
      }

      async function requestHelp() {
        try {
          const res = await fetch(ENDPOINT + '/api/request/create', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId }),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '请求失败');
          renderState(data.device.state);
        } catch (e) {
          alert('请求协助失败：' + e.message);
        }
      }

      async function endHelp() {
        try {
          await fetch(ENDPOINT + '/api/request/end', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId, by: 'user' }),
          });
          // 轮换密码，使已下发的旧凭据失效
          if (TOKEN) {
            currentPassword = randPassword(8);
            await localJson('/password', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: currentPassword }),
            });
            await fetch(ENDPOINT + '/api/device/register', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: deviceId, password: currentPassword }),
            });
          }
        } catch (e) {
          console.warn('end assist error', e);
        }
      }

      // ── 被控端批准：接入 / 控制 / 权限（GateDesk-api.md §6.7）────────────────
      // 本地 API 没有推送通道（§8.1 要求平台也轮询），所以靠轮询 GET /sessions 发现
      // authorized=false（有人在请求接入）与 pending_control=true（有人在请求接管键鼠）。
      const CONTROL_WINDOW_MS = 60000; // 与控制层 CONTROL_REQUEST_TIMEOUT 对齐
      const SESSIONS_POLL_MS = 2000;   // 必须显著小于 60 秒，否则会错过控制窗口
      // §6.7.4 白名单里打算给客户看的四项。restart / recording 偏运维，block_input 仅
      // Windows，privacy_mode 要看平台有没有实现，这三类留给桌面端面板。
      const PERMISSIONS = [
        { name: 'keyboard', label: '键鼠' },
        { name: 'clipboard', label: '剪贴板' },
        { name: 'audio', label: '声音' },
        { name: 'file', label: '文件传输' },
      ];
      const pendingSince = new Map(); // 会话 id -> 首次看到 pending_control 的时刻
      let sessionsSig = '';
      let noteTimer = null;

      function sessionPeer(s) {
        return (s.name || '').trim() || s.peer_id || '未知对端';
      }

      // 只有远程桌面类会话有这套权限开关；文件传输 / 摄像头 / 终端没有键鼠可给。
      function isDesktopSession(s) {
        return !s.is_file_transfer && !s.is_view_camera && !s.is_terminal && !s.port_forward;
      }

      function sessionBadge(s) {
        if (s.disconnected) return '<span class="badge">已结束</span>';
        if (!s.authorized) return '<span class="badge wait">等待接入</span>';
        if (s.pending_control) return '<span class="badge ctrl">请求控制</span>';
        return '<span class="badge live">协助中</span>';
      }

      function actionBtn(act, id, label, cls, accept) {
        const extra = accept === undefined ? '' : ` data-accept="${accept}"`;
        return `<button class="btn-small ${cls}" data-act="${act}" data-id="${id}"${extra}>${label}</button>`;
      }

      function sessionHtml(s) {
        const out = ['<div class="approval-item">'];
        out.push(
          `<div class="approval-head"><b>${escapeHtml(sessionPeer(s))}</b>` +
            `<span class="kv">ID ${escapeHtml(s.peer_id || '—')}</span>${sessionBadge(s)}</div>`
        );
        if (!s.authorized && !s.disconnected) {
          out.push('<div class="kv">该对端正在请求接入本机。</div>');
          out.push(
            '<div class="row">' +
              actionBtn('approve', s.id, '允许接入', 'btn-allow', true) +
              actionBtn('approve', s.id, '拒绝', 'btn-deny', false) +
              '</div>'
          );
        }
        if (s.pending_control) {
          const since = pendingSince.get(s.id) || Date.now();
          out.push(
            '<div class="control-ask">对端请求接管本机键盘鼠标，还有 ' +
              `<span class="countdown" data-deadline="${since + CONTROL_WINDOW_MS}">…</span>，` +
              '超时按拒绝处理。</div>'
          );
          out.push(
            '<div class="row">' +
              actionBtn('control', s.id, '允许控制', 'btn-allow', true) +
              actionBtn('control', s.id, '拒绝控制', 'btn-deny', false) +
              '</div>'
          );
        }
        if (s.authorized && !s.disconnected && isDesktopSession(s)) {
          out.push(
            '<div class="kv">权限（与「允许控制」是两道独立的闸门，都给了对端才能真正操作键鼠）：</div>'
          );
          out.push(
            '<div class="row">' +
              PERMISSIONS.map(
                (p) =>
                  `<label class="perm"><input type="checkbox" data-act="permission" ` +
                  `data-id="${s.id}" data-name="${p.name}"${s[p.name] ? ' checked' : ''}> ${p.label}</label>`
              ).join('') +
              '</div>'
          );
        }
        out.push('<div class="row">');
        out.push(
          s.disconnected
            ? actionBtn('dismiss', s.id, '清理', 'btn-deny')
            : actionBtn('terminate', s.id, '结束该会话', 'btn-end')
        );
        out.push('</div></div>');
        return out.join('');
      }

      function sessionsSignature(list) {
        return list
          .map((s) =>
            [
              s.id, s.authorized, s.disconnected, s.pending_control,
              s.keyboard, s.clipboard, s.audio, s.file,
              s.name, s.peer_id,
            ].join(',')
          )
          .join('|');
      }

      function renderApprovals(list) {
        const sig = sessionsSignature(list);
        // 内容没变就别重建 DOM——重建会闪，也会把倒计时重新起算。
        if (sig === sessionsSig) return;
        sessionsSig = sig;
        $('approvalList').innerHTML = list.map(sessionHtml).join('');
        tickCountdowns();
      }

      function tickCountdowns() {
        const now = Date.now();
        document.querySelectorAll('#approvalList [data-deadline]').forEach((el) => {
          const left = Math.max(0, (Number(el.dataset.deadline) || 0) - now);
          el.textContent = Math.ceil(left / 1000) + ' 秒';
        });
      }
      setInterval(tickCountdowns, 500);

      // 卡片常驻显示，所以“现在能不能批准、为什么不能”必须写出来，否则功能藏在默认
      // 隐藏的卡片里根本找不到（本机作为控制端时 /sessions 会一直 503，就是这种情况）。
      function setApprovalState(text, kind) {
        const el = $('approvalState');
        el.textContent = text;
        el.style.color = kind === 'bad' ? '#dc2626' : kind === 'warn' ? '#92400e' : '#4b5563';
      }

      async function pollSessions() {
        if (!TOKEN) {
          setApprovalState('未携带本地 API token，批准功能不可用。请用 start-client.sh 打开本页。', 'warn');
          renderApprovals([]);
          return;
        }
        let data;
        try {
          data = await localJson('/sessions');
        } catch (e) {
          pendingSince.clear();
          if (e.status === 503) {
            // 503 不是故障：本机没有连接管理器在听（没有会话，或会话面板窗口已退出）。
            // 本机作为控制端时也会走到这里 —— 批准只对被控端有意义。
            setApprovalState('本机没有会话面板在运行：当前没有对端接入，或会话面板已退出。');
          } else if (e.status === 401) {
            setApprovalState('本地 API 返回 401：页面 token 与本机配置不一致，重启 GateDesk 后重试。', 'bad');
          } else {
            setApprovalState('无法读取会话列表：' + e.message, 'bad');
          }
          renderApprovals([]);
          return;
        }
        const list = (data && data.sessions) || [];
        // 服务端的 60 秒从请求抵达时开始算，页面只能从「第一次看到」起算，
        // 所以这个倒计时最多乐观一个轮询周期；真正的裁决在服务端。
        const seen = new Set();
        for (const s of list) {
          seen.add(s.id);
          if (!s.pending_control) pendingSince.delete(s.id);
          else if (!pendingSince.has(s.id)) pendingSince.set(s.id, Date.now());
        }
        for (const id of [...pendingSince.keys()]) {
          if (!seen.has(id)) pendingSince.delete(id);
        }
        setApprovalState(
          list.length === 0 ? '当前没有对端请求接入或控制。' : '以下对端需要您处理：'
        );
        renderApprovals(list);
      }

      function note(text, bad) {
        const el = $('approvalNote');
        el.textContent = text || '';
        el.style.color = bad ? '#dc2626' : '#166534';
        if (noteTimer) clearTimeout(noteTimer);
        if (text) noteTimer = setTimeout(() => { el.textContent = ''; }, 4000);
      }

      // §6.7 的动作都是幂等的：409 说明状态已经变了（放行已放行的、应答已被超时拒绝的
      // 控制请求），504 说明连接管理器没在 2 秒内回话。这两种情况重新拉一次 /sessions 就够，
      // 不必拿错误去惊动用户。
      async function sessionAction(path, body, okText) {
        try {
          await localJson(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          note(okText);
        } catch (e) {
          if (e.status === 409 || e.status === 404 || e.status === 504) {
            note('状态已变化，已刷新', true);
          } else if (e.status === 503) {
            note('本机没有会话面板在运行，无法代为批准', true);
          } else {
            note('操作失败：' + e.message, true);
          }
        }
        await pollSessions();
      }

      function onApprovalClick(event) {
        const el = event.target.closest('button[data-act]');
        if (!el) return;
        const id = Number(el.dataset.id);
        const accept = el.dataset.accept === 'true';
        switch (el.dataset.act) {
          case 'approve':
            sessionAction('/approve', { id, accept }, accept ? '已放行接入' : '已拒绝接入');
            break;
          case 'control':
            // 与桌面端面板一致：允许控制只应答控制请求，不动权限开关（两者是独立闸门）。
            sessionAction('/control', { id, accept }, accept ? '已允许控制' : '已拒绝控制');
            break;
          case 'terminate':
            if (confirm('结束该会话？对端会收到通知，之后可以重新连接。')) {
              sessionAction('/terminate', { id }, '已结束该会话');
            }
            break;
          case 'dismiss':
            sessionAction('/dismiss', { id }, '已清理');
            break;
        }
      }

      function onApprovalChange(event) {
        const el = event.target;
        if (!el || el.dataset.act !== 'permission') return;
        const found = PERMISSIONS.find((p) => p.name === el.dataset.name);
        const label = (found && found.label) || el.dataset.name;
        sessionAction(
          '/permission',
          { id: Number(el.dataset.id), name: el.dataset.name, enabled: el.checked },
          label + (el.checked ? '已打开' : '已关闭')
        );
      }

      async function init() {
        if (!TOKEN) $('tokenWarn').hidden = false;
        try {
          await goOnline();
        } catch (e) {
          $('deviceLine').textContent = '无法读取本机 GateDesk ID';
          $('deviceErr').hidden = false;
          $('deviceErr').textContent = e.message;
          $('retryBtn').hidden = false;
        }
        // 定时：刷新本机在线状态 + 向服务端报心跳（维持设备在线/离线判定）。
        setInterval(refreshStatus, 5000);
        // 轮询本机会话：/sessions 没有推送通道，必须主动查（§8.1 也要求间隔远小于 60 秒）。
        if (TOKEN) {
          pollSessions();
          setInterval(pollSessions, SESSIONS_POLL_MS);
        }
      }

      $('retryBtn').addEventListener('click', init);
      $('requestBtn').addEventListener('click', requestHelp);
      $('voiceBtn').addEventListener('click', toggleVoice);
      $('endBtn').addEventListener('click', endHelp);
      $('chatSend').addEventListener('click', sendChat);
      $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
      $('approvalList').addEventListener('click', onApprovalClick);
      $('approvalList').addEventListener('change', onApprovalChange);

      init();
    </script>
  </body>
</html>
