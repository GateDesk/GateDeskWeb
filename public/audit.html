<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateDesk - 审计事件看板</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 24px; }
      .container { max-width: 1200px; margin: 0 auto; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
      .header h1 { margin: 0; font-size: 22px; }
      .nav a { text-decoration: none; background: #111827; color: white; padding: 10px 14px; border-radius: 8px; margin-left: 8px; font-size: 14px; }
      .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 8px 18px rgba(17,24,39,0.06); margin-bottom: 16px; }
      .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
      .filters label { display: grid; gap: 4px; font-size: 12px; color: #4b5563; }
      .filters input[type=text], .filters input[type=number] {
        padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; min-width: 140px;
      }
      button { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; }
      .apply-btn { background: #2563eb; }
      .clear-btn { background: #dc2626; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; }
      .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
      .stat { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
      .stat b { font-family: monospace; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
      th { background: #f9fafb; color: #374151; position: sticky; top: 0; }
      td.mono { font-family: monospace; }
      td.extra { color: #6b7280; max-width: 320px; word-break: break-all; }
      .pill { border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: bold; background: #e5e7eb; color: #374151; }
      .pill.ok { background: #dcfce7; color: #166534; }
      .pill.err, .pill.denied { background: #fee2e2; color: #991b1b; }
      .empty { color: #6b7280; padding: 24px; text-align: center; }
      .muted { color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>GateDesk 操作级审计看板</h1>
        <div class="nav">
          <a href="/admin">运维端</a>
          <a href="/employee">用户端</a>
        </div>
      </div>

      <div class="card">
        <div class="filters">
          <label>action
            <input type="text" id="fAction" placeholder="如 connect.start" />
          </label>
          <label>deviceId
            <input type="text" id="fDevice" placeholder="受控端 GateDesk ID" />
          </label>
          <label>limit
            <input type="number" id="fLimit" value="200" min="1" max="5000" />
          </label>
          <button class="apply-btn" id="btnApply">查询</button>
          <button class="clear-btn" id="btnClear">清空</button>
          <span class="toggle"><input type="checkbox" id="autoRefresh" checked />自动刷新(3s)</span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="muted" id="statusLine" style="margin-top:10px;">加载中…</div>
      </div>

      <div class="card" style="padding:0; overflow:auto; max-height: 62vh;">
        <table>
          <thead>
            <tr>
              <th style="width:150px;">时间</th>
              <th style="width:150px;">action</th>
              <th style="width:90px;">actor</th>
              <th style="width:130px;">device_id</th>
              <th style="width:110px;">session_id</th>
              <th style="width:80px;">result</th>
              <th>extra</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty">暂无审计事件</div>
      </div>

      <div class="muted">
        数据来源：桌面端 GateDesk 经 <code>[options] audit-server-url</code> 上报到本服务
        <code>POST /api/audit</code>（同时会写各机本地 <code>audit.log</code>）；本页只做查询展示。
      </div>
    </div>

    <script>
      const ENDPOINT = window.location.origin;
      let timer = null;

      function fmtTime(ts) {
        if (!ts) return '-';
        const d = new Date(Number(ts));
        if (isNaN(d.getTime())) return String(ts);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
      }

      function resultPill(result) {
        const r = String(result || '');
        const cls = r === 'ok' ? 'ok' : (r === 'err' || r === 'denied' ? 'err' : '');
        return `<span class="pill ${cls}">${esc(r || '-')}</span>`;
      }

      function renderStats(events) {
        const by = {};
        for (const e of events) by[e.action] = (by[e.action] || 0) + 1;
        const items = Object.entries(by).sort((a, b) => b[1] - a[1]);
        document.getElementById('stats').innerHTML = items.length
          ? items.map(([a, n]) => `<span class="stat">${esc(a)} <b>${n}</b></span>`).join('')
          : '';
      }

      function render(events) {
        document.getElementById('rows').innerHTML = events
          .map((e) => `<tr>
            <td class="mono">${esc(fmtTime(e.ts))}</td>
            <td class="mono">${esc(e.action)}</td>
            <td>${esc(e.actor)}</td>
            <td class="mono">${esc(e.device_id)}</td>
            <td class="mono">${esc(e.session_id)}</td>
            <td>${resultPill(e.result)}</td>
            <td class="extra">${esc(JSON.stringify(e.extra || {}))}</td>
          </tr>`)
          .join('');
        document.getElementById('empty').style.display = events.length ? 'none' : 'block';
        renderStats(events);
      }

      async function load() {
        const params = new URLSearchParams();
        const action = document.getElementById('fAction').value.trim();
        const deviceId = document.getElementById('fDevice').value.trim();
        const limit = document.getElementById('fLimit').value.trim();
        if (action) params.set('action', action);
        if (deviceId) params.set('deviceId', deviceId);
        if (limit) params.set('limit', limit);
        const status = document.getElementById('statusLine');
        try {
          const res = await fetch(`${ENDPOINT}/api/audit?${params.toString()}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          render(data.events || []);
          status.textContent = `共 ${data.total} 条${action || deviceId ? '（已过滤）' : ''}，最近更新 ${new Date().toLocaleTimeString()}`;
        } catch (e) {
          status.textContent = `查询失败：${e.message}`;
        }
      }

      function setAuto(on) {
        if (timer) { clearInterval(timer); timer = null; }
        if (on) timer = setInterval(load, 3000);
      }

      document.getElementById('btnApply').addEventListener('click', load);
      document.getElementById('autoRefresh').addEventListener('change', (e) => setAuto(e.target.checked));
      document.getElementById('btnClear').addEventListener('click', async () => {
        if (!confirm('清空服务端审计缓冲？')) return;
        await fetch(`${ENDPOINT}/api/audit/clear`, { method: 'POST' });
        load();
      });

      load();
      setAuto(true);
    </script>
  </body>
</html>
